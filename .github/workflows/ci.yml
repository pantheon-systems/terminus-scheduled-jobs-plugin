name: Test & Build
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint-php:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Full Composer Install
        run: composer install
      - name: Validate Code
        run: composer lint
  phpcompatibility:
    runs-on: ubuntu-latest
    name: PHP Compatibility
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Full Composer Install
        run: composer install
      - name: PHPCompatibility
        uses: pantheon-systems/phpcompatibility-action@6bcfb79e78f644a471e856a1e92e14148a8e4017 # v1.1.4
        with:
          test-versions: 7.4-8.3
          paths: ${{ github.workspace }}/src
  unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Full Composer Install
        run: composer install
      - name: Run unit tests
        run: composer unit
    needs:
      - lint-php
      - phpcompatibility

  e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: E2E Tests
    needs:
      - unit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer
      - name: Install Terminus
        uses: pantheon-systems/terminus-github-actions@8fb365801c4abd633407f65ecb475a540ddb38f1 # main
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}
      - name: Install plugin
        run: terminus self:plugin:install "${{ github.workspace }}"
      - name: Run E2E tests
        env:
          E2E_SITE_ENV: ${{ secrets.E2E_SITE_ENV }}
        run: bash e2e/test.sh
