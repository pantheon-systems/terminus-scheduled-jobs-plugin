name: Test & Build
on:
  pull_request:

jobs:
  checkout_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    name: Checkout & Lint
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '7.4'
      - name: Save repo content as artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: full-workspace
          path: ${{ github.workspace }}
      - name: Full Composer Install
        run: composer install
      - name: Validate Code
        run: composer lint
  phpcompatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: PHP Compatibility
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: PHPCompatibility
        uses: pantheon-systems/phpcompatibility-action@7bf1b2881e207c80ad4569874ceee225f59537d1 # v1.1.1
        with:
          test-versions: 7.4-8.4
          paths: ${{ github.workspace }}/src

  functional:
    runs-on: ${{ matrix.operating-system }}
    permissions:
      contents: read
      actions: read
    name: Functional testing matrix - PHP ${{ matrix.php-versions }} on ${{ matrix.operating-system }}
    if: ${{ github.repository_owner == 'pantheon-systems' }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
        php-versions: [ '7.4', '8.1', '8.2', '8.3', '8.4' ]
        terminus-version: [ '3.6.2', '4.1.7' ]
        exclude:
          - php-versions: '7.4'
            terminus-version: '4.1.7'
          - php-versions: '8.1'
            terminus-version: '4.1.7'
      max-parallel: 3
    env:
      TERMINUS_TOKEN: ${{ secrets.TERMINUS_TOKEN }}
      TERMINUS_SITE: ${{ secrets.TERMINUS_SITE }}
      TERMINUS_TESTING_RUNTIME_ENV: dev
      TERMINUS_ALLOW_UNSUPPORTED_NEWER_PHP: true
      TERMINUS_VERSION: ${{ matrix.terminus-version }}
    needs:
      - checkout_build
      - phpcompatibility
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: gd, mbstring, zip, ssh2-1.3.1, pcov
          coverage: pcov
          ini-values: error_reporting=E_ALL
      - name: Download repo content from artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: full-workspace
      - name: Full Composer Install
        run: composer install
      - name: Install Terminus
        uses: pantheon-systems/terminus-github-actions@8e024bd89ff46ed2aa4e0663c6b54c87a94344f8 # main 2025-04-25T19:40:25Z
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}
          terminus-version: ${{ env.TERMINUS_VERSION }}
      - name: Run e2e tests
        run: bash "${GITHUB_WORKSPACE}/.github/e2e.sh"
